{% extends "base.html" %}

{% block title %}Reset Password — QuickHire{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
      
      <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="stat-icon bg-warning-subtle text-warning mx-auto mb-2" style="width: 55px; height: 55px; font-size: 1.5rem;">
            <i class="bi bi-key-fill"></i>
          </div>
          <h3 class="fw-extrabold m-0 text-dark">Reset Your Password</h3>
          <p class="text-muted small mt-1">Enter your registered email and choose a new secure password.</p>
        </div>

        <form method="POST" action="{{ url_for('auth_routes.forgot_password') }}">
          
          <!-- Email Input -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Registered Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@gmail.com" required>
            </div>
          </div>

          <!-- New Password with Show/Hide Eye Toggle -->
          <div class="mb-3">
            <label for="new_password" class="form-label fw-semibold small">New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control" id="new_password" name="new_password" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('new_password', this)" title="Show / Hide Password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Confirm New Password with Show/Hide Eye Toggle -->
          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold small">Confirm New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-shield-lock text-muted"></i></span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary border" type="button" onclick="togglePasswordVisibility('confirm_password', this)" title="Show / Hide Password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3 shadow-sm">
            <i class="bi bi-check2-circle me-1"></i> Update Password &amp; Continue
          </button>
        </form>

        <div class="text-center small text-muted pt-3 border-top">
          Remembered your password? 
          <a href="{{ url_for('auth_routes.login') }}" class="fw-bold text-primary text-decoration-none">
            Back to Login
          </a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
