{% extends "base.html" %}

{% block title %}Sign in with Google — QuickHire{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      
      <div class="card card-custom p-4 p-md-5 shadow-lg border-0 bg-white">
        
        <!-- Google Logo Header -->
        <div class="text-center mb-4">
          <svg width="48" height="48" viewBox="0 0 48 48" class="mb-3">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <h3 class="fw-bold text-dark m-0">Sign in with Google</h3>
          <p class="text-muted small mt-1">to continue to <strong>QuickHire</strong> as <span class="badge {% if role == 'employer' %}bg-primary-subtle text-primary{% else %}bg-success-subtle text-success{% endif %} text-capitalize">{{ role }}</span></p>
        </div>

        <form method="POST" action="{{ url_for('auth_routes.google_auth', role=role) }}">
          
          <div class="mb-3">
            <label for="google_name" class="form-label fw-semibold small">Your Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control" id="google_name" name="google_name" placeholder="e.g. Naveen Kumar" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="google_email" class="form-label fw-semibold small">Google Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-google text-muted"></i></span>
              <input type="email" class="form-control" id="google_email" name="google_email" placeholder="you@gmail.com" required>
            </div>
            <div class="form-text small text-muted">We will securely link your Google account to QuickHire.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
            <i class="bi bi-shield-check me-1"></i> Continue with this Google Account
          </button>
        </form>

        <div class="text-center small text-muted pt-3 border-top">
          Prefer standard email &amp; password? 
          <a href="{{ url_for('auth_routes.login', role=role) }}" class="fw-bold text-primary text-decoration-none">
            Back to Regular Login
          </a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
